limit_req_zone $binary_remote_addr zone=bird_feeder_requests:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=bird_feeder_connections:10m;

server {
    listen 192.168.1.20:80;
    server_name 192.168.1.20 bird-feeder-pi.local;
    return 301 https://$host$request_uri;
}

server {
    listen 192.168.1.20:443 ssl;
    server_name 192.168.1.20 bird-feeder-pi.local;

    ssl_certificate /etc/bird-feeder/tls/server.crt;
    ssl_certificate_key /etc/bird-feeder/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BirdFeederTLS:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    auth_basic "Private bird gallery";
    auth_basic_user_file /etc/nginx/bird-feeder.htpasswd;

    client_max_body_size 8k;
    limit_conn bird_feeder_connections 20;
    limit_req zone=bird_feeder_requests burst=100 nodelay;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }
}
